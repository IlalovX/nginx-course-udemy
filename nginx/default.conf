server {
    listen 80;
    server_name localhost;

    if ($blocked_user_agent = 1) {
        return 403;
    }

    access_log /var/log/nginx/course-access.log main;
    error_log /var/log/nginx/course-error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /health {
        default_type text/plain;
        return 200 "Nginx HTTP is healthy\n";
    }

    location /geo {
        default_type application/json;

        return 200 '{
            "clientIp": "$remote_addr",
            "countryCode": "$geoip2_country_code",
            "countryName": "$geoip2_country_name"
        }';
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    if ($blocked_user_agent = 1) {
        return 403;
    }

    access_log /var/log/nginx/course-https-access.log main;
    error_log /var/log/nginx/course-https-error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /health {
        default_type application/json;

        return 200 '{
            "status": "ok",
            "protocol": "$server_protocol"
        }';
    }

    location /admin/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /usr/share/nginx/html;
        index index.html;
    }

    location = /admin {
        return 301 /admin/;
    }
}