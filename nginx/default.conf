server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/course-access.log main;
    error_log /var/log/nginx/course-error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /health {
        default_type text/plain;
        return 200 "Nginx is healthy\n";
    }

    location /geo {
        default_type application/json;

        return 200 '{
            "clientIp": "$remote_addr",
            "proxyIp": "$realip_remote_addr",
            "forwardedFor": "$http_x_forwarded_for",
            "countryCode": "$geoip2_country_code",
            "countryName": "$geoip2_country_name",
            "blocked": "$country_blocked"
        }';
    }

    location /restricted {
        if ($country_blocked) {
            return 403;
        }

        default_type application/json;

        return 200 '{
            "message": "Access granted",
            "countryCode": "$geoip2_country_code",
            "countryName": "$geoip2_country_name"
        }';
    }
}